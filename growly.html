<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GROWLY RE:FORM · 75 Days</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--fg:#fff;--s:#BDBDBD;--c:#101010;--l:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:500 15px/1.55 Montserrat,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-weight:700;letter-spacing:.02em}h1{font-size:clamp(26px,5vw,40px);line-height:1.15}h2{font-size:20px;margin:22px 0 10px}h3{font-size:15px;margin:12px 0 4px}
p,li{color:var(--s);font-size:14px}ul{padding-left:18px}b{color:var(--fg)}
.side{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:#0a0a0aF2;border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
.side .logo{display:none}
.side button{flex:1;background:none;border:0;color:var(--s);padding:9px 0 8px;font:600 10px Montserrat;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.side button span:first-child{font-size:17px}.side .fl{display:none}.side button.on{color:#fff}
main{padding:20px 16px 130px;max-width:960px;margin:auto}
.fade{animation:f .35s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;margin:10px 0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.grid .card{margin:0}
.big{font-size:30px;font-weight:700;color:#fff;line-height:1.1}.sm{font-size:12px;color:var(--s)}
.btn{background:#fff;color:#000;border:0;border-radius:999px;padding:11px 20px;font:700 13px Montserrat;cursor:pointer;margin:6px 6px 0 0;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn.o{background:none;color:#fff;border:1px solid var(--s)}.btn:focus-visible,input:focus-visible+.bx,summary:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.bar{height:8px;background:#222;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#777,#fff);border-radius:9px;transition:width .5s}
.chk{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;color:#fff;border-bottom:1px solid #1a1a1a}
.chk input{position:absolute;opacity:0}.bx{flex:none;width:22px;height:22px;border:2px solid var(--s);border-radius:6px;display:grid;place-items:center;transition:.2s}
.chk input:checked+.bx{background:#fff;border-color:#fff}.chk input:checked+.bx:after{content:"✓";color:#000;font-weight:700;font-size:14px}
.chk input:checked~span:last-child{color:var(--s);text-decoration:line-through}
.ring{width:130px;height:130px}.ring circle{fill:none;stroke-width:8}.ring .tr{stroke:#222}.ring .pr{stroke:#fff;stroke-linecap:round;transition:stroke-dasharray .6s}.ring text{fill:#fff;font:700 20px Montserrat;text-anchor:middle}
.rings{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
details{background:var(--c);border:1px solid var(--l);border-radius:12px;margin:8px 0}summary{padding:13px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details[open]{border-color:var(--s)}details .body{padding:0 16px 14px;animation:f .3s}
.tag{font-size:11px;border:1px solid var(--s);border-radius:99px;padding:2px 9px;color:var(--s);white-space:nowrap}.tag.ok{background:#fff;color:#000;border-color:#fff}
.bars{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:1px solid var(--l)}.bars i{flex:1;background:#fff;border-radius:2px 2px 0 0;min-height:3px}.bars i.p1{background:var(--s)}.bars i.p2{background:#7a7a7a}.bars i.fut{opacity:.2}
.wk{display:flex;align-items:flex-end;gap:8px;height:130px}.wk div{flex:1;text-align:center;font-size:10px;color:var(--s);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.wk i{display:block;background:#fff;border-radius:4px 4px 0 0;min-height:3px;margin-bottom:4px}
.ex{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1a1a1a}.ex b{display:block}
textarea{width:100%;min-height:90px;background:#000;color:#fff;border:1px solid var(--l);border-radius:10px;padding:10px;font:12px monospace}input[type=number]{background:#000;color:#fff;border:1px solid var(--s);border-radius:8px;padding:9px;width:80px;font:600 14px Montserrat}
#timer{position:fixed;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:15;background:#0d0d0d;border:1px solid var(--s);border-radius:14px;padding:10px 14px;width:min(250px,calc(100% - 24px));display:none}
#timer.show{display:block}#tt{font-size:28px;font-weight:700}#timer button{padding:6px 11px;font-size:11px}
#modal{position:fixed;inset:0;background:#000c;z-index:50;display:none;place-items:center;padding:20px}#modal.show{display:grid}#modal .card{max-width:380px;background:#111}
.load{height:60vh;display:grid;place-items:center;letter-spacing:.3em;color:var(--s);animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.3}}
.wm{font-weight:700;letter-spacing:.35em;font-size:20px}.hero{padding:26px 4px 8px}.warn{border-left:3px solid var(--s);padding-left:12px;font-size:12px;color:var(--s);margin-top:18px}
@media(min-width:900px){.side{top:0;right:auto;bottom:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--l);padding:26px 14px}
.side .logo{display:block;margin:0 10px 28px}.side button{flex:none;flex-direction:row;gap:12px;font-size:13px;padding:12px;text-align:left;border-radius:10px;justify-content:flex-start}.side button.on{background:#1b1b1b}.side .sl{display:none}.side .fl{display:inline}
main{margin-left:220px;max-width:none;padding:34px 48px 60px}#timer{bottom:20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.logoimg{display:block;width:200px;max-width:70%;margin:-26px auto -30px;mix-blend-mode:screen}.side .logo img{width:150px;margin:-20px 0 -24px -10px;mix-blend-mode:screen}
.ex .sm{display:block;font-size:14px;text-align:left;max-width:none}.ex b{font-size:15px}.mini{border:0;background:none;margin:4px 0}.mini summary{padding:4px 0;font-size:12px;color:#fff;text-decoration:underline;justify-content:flex-start}
button:disabled{opacity:.3;cursor:default}[hidden]{display:none!important}.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
</style></head><body>
<nav class="side" id="nav" aria-label="Main"></nav>
<main id="main"><div class="load">GROWLY</div></main>

irst 30 minutes awake.|Finish one project task you have avoided.|Study one topic for 60 minutes with notes.|Say no to one time-waster.|Read 25 pages and write 3 takeaways.|Practise confident posture all day.|Write a plan for your next obstacle.|Give someone a genuine compliment.|Ask for feedback and write it down.|Keep one bedtime and wake time all day.|Do a 90-minute distraction-free block.|Do one task slowly and completely.|Reduce one spending or time-wasting habit.|Summarise what you learned this month.|Present an idea out loud for 2 minutes.|Clean up your files and notes.|Write your daily non-negotiables list.|Help someone without taking credit.|Read for 30 minutes uninterrupted.|Plan how to continue after Day 75.|Thank someone who helped you.|Revisit your Day 1 goals and update them.|Choose 3 habits to keep for life.|Finale: write your RE:FORM story and celebrate.'.split('|');
function build(d){const i=d-1,p=d<=25?0:d<=50?1:2,w=Math.floor((i%25)/7),k=i%7,n=[2,3,3][p],r=[8,10,12][p]+w,rs=[60,45,45][p],pu=p?'push':'wall';
 const rx={squat:`${n} sets × ${r} reps · rest ${rs} sec`,wall:`${n} sets × ${r} reps · rest ${rs} sec`,push:`${n} sets × ${r-4} reps · rest ${rs} sec`,lunge:`${n} sets × ${Math.ceil(r/2)} reps each leg · rest ${rs} sec`,plank:`${n} sets × ${[15,25,30][p]+w*5} sec hold · rest ${rs} sec`,jj:`${n} sets × ${r+10} jumping jacks · rest ${rs} sec`,walk:`1 set × ${[15,25,30][p]+w*2} min · no rest needed`,str:'1 set × 5 min · hold each stretch 20 sec',ewalk:'1 set × 10 min easy pace · no rest needed'};
 const T=[['Legs and arms',['squat',pu,'plank'],'Go at your own pace.'],['Walking day',['walk','str'],'Easy and steady.'],['Legs and cardio',['lunge','squat','jj'],'Rest properly between sets.'],['Recovery day',['str','ewalk'],'Keep it gentle today.'],['Strength day',['lunge',pu,'plank'],'Good form matters more than speed.'],['Walk and cardio',['walk','jj'],'Stop and rest if you feel dizzy.'],['Rest day',[],'Rest completely today. Relax, drink water and sleep well. A gentle walk is fine.']][k];
 const sn=SN[i%6].split('|');
 return{d,p,rest:k===6,title:T[0]+(d===75?' · Final day':''),note:T[2],ex:T[1].map(x=>[x==='ewalk'?'walk':x,rx[x]]),
  meals:[['Breakfast',B[i%6]],['Lunch',L[(i+1)%6]],['Evening snack',sn[1]?SN[i%6]:sn[0]],['Dinner',D[(i+2)%6]]],task:MIS[i]}}
const DAYS=Array.from({length:75},(_,i)=>build(i+1));
const req=d=>TASKS.map(t=>t[0]).filter(t=>!(t==='w'&&DAYS[d-1].rest));
const got=(d,t)=>!!(S.done[d]&&S.done[d][t]);
const pct=d=>req(d).filter(t=>got(d,t)).length/req(d).length;
const isDone=d=>pct(d)===1,P=x=>Math.round(x*100);
const doneCount=()=>DAYS.filter(x=>isDone(x.d)).length;
function streak(){let i=isDone(S.cur)?S.cur:S.cur-1,n=0;while(i>=1&&isDone(i)){n++;i--}return n}
const weekPct=w=>{const a=DAYS.filter(x=>Math.floor((x.d-1)/7)===w);return a.reduce((s,x)=>s+pct(x.d),0)/a.length};
const label=(d,t)=>t==='w'&&DAYS[d-1].rest?'Rest day: relax or take a gentle walk (optional)':TASKS.find(x=>x[0]===t)[1];
const row=(d,t)=>`<label class="chk"><input type="checkbox" data-d="${d}" data-t="${t}" ${got(d,t)?'checked':''}><span class="bx"></span><span>${label(d,t)}</span></label>`;
const bar=(p,id)=>`<div class="bar"><i ${id?'id="'+id+'"':''} style="width:${P(p)}%"></i></div>`;
const stat=(v,l)=>`<div class="card"><div class="big">${v}</div><div class="sm">${l}</div></div>`;
const exRow=(e,how)=>`<div class="ex"><div><b>${EX[e[0]][0]}</b><span class="sm">${e[1]}</span>${how?`<details class="mini"><summary>How to do it</summary><p>${EX[e[0]][1]}</p><p><b>Easier:</b> ${EX[e[0]][2]}</p></details>`:''}</div></div>`;
const mealRows=x=>x.meals.map(([n,v])=>{const[a,b]=v.split('|');return`<div class="ex"><div><b>${n}</b>${b?`<span class="sm">Veg: ${a}</span><span class="sm">Non-veg: ${b}</span>`:`<span class="sm">${a}</span>`}</div></div>`}).join('');
const safe='<div class="warn">GROWLY RE:FORM is general adult wellness guidance, not medical advice. Adapt exercises and meals to your needs, go at your own pace, and stop if something hurts. If you have a medical condition, an injury or special dietary needs, check with a doctor first.</div>';
let page='today';
const dayHTML=d=>{const x=DAYS[d-1];return`<p>${x.note}</p>${x.ex.length?x.ex.map(e=>exRow(e,false)).join(''):''}<h3>Food</h3>${mealRows(x)}<h3>Self-improvement task</h3><p>${x.task}</p><button class="btn" data-act="goday" data-d="${d}">Open this day</button>`};
const R={
today(){const d=S.cur,x=DAYS[d-1];return`<div class="hero" style="text-align:center"><img class="logoimg" src="${LOGO}" alt="GROWLY"><p class="sm">${PH[x.p]}</p><h1>Day ${d} of 75</h1><p>${75-d} days remaining</p><button class="btn o" data-act="prev" ${d<2?'disabled':''}>‹ Previous</button><button class="btn o" data-act="next" ${d>74?'disabled':''}>Next ›</button></div>
<div class="card"><div class="row2"><span>Today’s completion</span><b class="big" id="pp">${P(pct(d))}%</b></div>${bar(pct(d),'pb')}<p id="dn" ${pct(d)<1?'hidden':''}>Day complete. Well done! Tap Next to move on.</p></div>
<h2>1. Today’s workout</h2><div class="card"><h3>${x.title}</h3><p>${x.note}</p>${x.rest?'':'<p>Warm up first: march on the spot for 2 minutes.</p>'}${x.ex.map(e=>exRow(e,true)).join('')}</div>
<h2>2. Today’s food</h2><div class="card">${mealRows(x)}<p class="sm" style="margin-top:8px">Eat until comfortably full. Adjust portions and swap meals to suit you.</p></div>
<h2>3. Today’s habits</h2><div class="card"><p><b>Self-improvement task:</b> ${x.task}</p>${req(d).map(t=>row(d,t)).join('')}</div>${safe}`},
plan(){return PH.map((n,p)=>`<h2>Days ${p*25+1}–${p*25+25}: ${n}</h2>`+DAYS.filter(x=>x.p===p).map(x=>`<details data-d="${x.d}"><summary><span>Day ${x.d} · ${x.title}</span>${isDone(x.d)?'<span class="tag ok">Done</span>':''}</summary><div class="body"></div></details>`).join('')).join('')+safe},
food(){const g=[['Protein','Helps your body repair and build muscle.','Eggs, fish, chicken, milk, curd, paneer, dal, chickpeas, beans.'],['Vitamins and minerals','Keep you healthy and energetic.','Colourful fruits and vegetables: papaya, guava, orange, carrot, cheera, drumstick. Ragi and milk for calcium.'],['Fibre','Helps digestion and keeps you full.','Vegetables, fruit, dal, chickpeas, oats, brown or red rice, chapati.'],['Healthy fats','Support your heart and brain.','Peanuts, nuts, seeds, fish, a little coconut and cooking oil.']];
 return`<h1>Food guide</h1><p>Simple, affordable Kerala and Indian food. Aim for something from each group every day.</p>`+g.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p><p><b>Examples:</b> ${x[2]}</p></div>`).join('')+`<div class="card"><h3>Water</h3><p>Drink water through the day. Have more when it is hot or after exercise.</p></div><p class="sm">No strict diets and no calorie counting. Portions are flexible, so eat according to your needs.</p>`+safe},
prog(){const d=S.cur,w=Math.floor((d-1)/7),c=doneCount();return`<h1>Progress</h1><div class="grid">${stat('Day '+d,'Current day')}${stat(c,'Days completed')}${stat(streak(),'Current streak')}</div>
<h2>Overall challenge</h2><div class="card"><div class="row2"><span>${c} of 75 days done</span><b>${P(c/75)}%</b></div>${bar(c/75)}</div>
<h2>Today’s checklist</h2><div class="card"><div class="row2"><span>${req(d).filter(t=>got(d,t)).length} of ${req(d).length} tasks</span><b>${P(pct(d))}%</b></div>${bar(pct(d))}</div>
<h2>Weekly progress</h2><div class="card"><div class="row2"><span>Week ${w+1}</span><b>${P(weekPct(w))}%</b></div>${bar(weekPct(w))}<div class="wk" style="margin-top:14px">${Array.from({length:11},(_,i)=>`<div><i style="height:${Math.max(3,P(weekPct(i))*.9)}%"></i>W${i+1}</div>`).join('')}</div></div>
<h2>Reset</h2><div class="card"><p>Progress is saved on this device only. Reset to start again from Day 1.</p><button class="btn o" data-act="ask">Reset progress</button></div>${safe}`}};
const NAV=[['today','Today','◉'],['plan','Plan','▦'],['food','Food','✿'],['prog','Progress','▲']];
function nav(){$('#nav').innerHTML=`<div class="logo"><img src="${LOGO}" alt="GROWLY"></div>`+NAV.map(n=>`<button data-act="go" data-p="${n[0]}" class="${n[0]===page?'on':''}" ${n[0]===page?'aria-current="page"':''}><span aria-hidden="true">${n[2]}</span><span class="sl">${n[1]}</span><span class="fl">${n[1]}</span></button>`).join('')}
function render(a){$('#main').innerHTML=R[page]();$('#main').className=a?'fade':'';if(a)window.scrollTo(0,0);nav()}
function go(p){page=R[p]?p:'today';if(location.hash!=='#'+page)location.hash=page;render(true)}
document.addEventListener('change',e=>{const t=e.target.dataset;if(!t||!t.t)return;const d=+t.d;S.done[d]=S.done[d]||{};S.done[d][t.t]=e.target.checked;save();const p=pct(d);if($('#pp')){$('#pp').textContent=P(p)+'%';$('#pb').style.width=P(p)+'%';$('#dn').hidden=p<1}});
document.addEventListener('toggle',e=>{const el=e.target;if(el.matches&&el.matches('details[data-d]')&&el.open){const b=$('.body',el);if(!b.innerHTML)b.innerHTML=dayHTML(+el.dataset.d)}},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='go')go(b.dataset.p);
 else if(a==='prev'){S.cur=Math.max(1,S.cur-1);save();render(true)}
 else if(a==='next'){S.cur=Math.min(75,S.cur+1);save();render(true)}
 else if(a==='goday'){S.cur=+b.dataset.d;save();go('today')}
 else if(a==='ask')$('#modal').classList.add('show');
 else if(a==='cancel')$('#modal').classList.remove('show');
 else if(a==='confirm'){S={done:{},cur:1};save();$('#modal').classList.remove('show');go('today')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show')});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(R[p]&&p!==page)go(p)});
setTimeout(()=>{const p=location.hash.slice(1);page=R[p]?p:'today';render(true)},300);
</script></body></html>
